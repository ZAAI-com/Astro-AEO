name: W2-Release

on:
  push:
    # Version tags without a leading "v", e.g. 0.6.0
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  id-token: write

jobs:
  astro-node-runtime:
    uses: ./.github/workflows/W-Node-Compat.yml

  publish:
    needs: astro-node-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release tag, package, adapters, and performance
        run: pnpm run release:check -- --tag "$GITHUB_REF_NAME" --require-tag --require-clean
        env:
          ASTRO_AEO_ADAPTER_RUNTIMES: node,cloudflare,deno
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
