name: W2-Release

on:
  push:
    # Version tags without a leading "v", e.g. 0.6.0
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read
  id-token: write

jobs:
  astro-node-runtime:
    uses: ./.github/workflows/W-Node-Compat.yml

  publish:
    needs: astro-node-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify npm supports Trusted Publishing
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          if (!/^\d+\.\d+\.\d+$/.test(version) || major < 11 ||
              (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            console.error(`::error::npm >=11.5.1 is required for Trusted Publishing; found ${version}. Upgrade npm before publishing.`);
            process.exit(1);
          }
          console.log(`npm ${version} supports Trusted Publishing.`);
          NODE
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release tag, package, adapters, and performance
        run: pnpm run release:check -- --tag "$GITHUB_REF_NAME" --require-tag --require-clean
        env:
          ASTRO_AEO_ADAPTER_RUNTIMES: node,cloudflare,deno
      - name: Publish to npm with OIDC and provenance
        run: npm publish --provenance --access public
