name: W1-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (astro ${{ matrix.astro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ['5', '6', '7']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require a Changeset or an already-versioned release
        if: matrix.astro == '7' && github.event_name == 'pull_request'
        run: node scripts/check-changesets.mjs --since "origin/${{ github.base_ref }}"
      - name: Pin Astro version for this leg
        if: matrix.astro != '7'
        run: pnpm add -D astro@${{ matrix.astro }}
      - name: Typecheck
        run: pnpm run typecheck
      # The published .d.ts files are hand-written and only ever seen by this
      # repo's own (newest) TypeScript. This checks them the way a downstream
      # project on an older toolchain would.
      - name: Consumer types on the oldest supported TypeScript
        run: pnpm run test:types
      - name: Unit, CLI and build e2e tests
        run: pnpm test
      - name: Dev-server e2e (astro 7 leg only)
        if: matrix.astro == '7'
        run: pnpm run test:dev
      # The on-demand contract needs a real adapter, so it cannot run against a
      # static build or the dev server. Newest Astro only, matching test:dev.
      - name: Adapter e2e (astro 7 leg only)
        if: matrix.astro == '7'
        run: pnpm run test:ssr
      # Provider packages intentionally target the latest Astro only. Node,
      # Cloudflare, and Deno emit runnable server entries; Vercel and Netlify
      # are validated through their provider artifact formats.
      - name: Build all supported adapters (astro 7 leg only)
        if: matrix.astro == '7'
        run: pnpm run test:adapters:build

  adapter-runtime:
    name: adapter runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Request contract on Node, workerd, and Deno
        env:
          ASTRO_AEO_ADAPTER_RUNTIMES: node,cloudflare,deno
        run: pnpm run test:adapters:runtime

  node-compat:
    name: node ${{ matrix.node }} compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.5', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # Install with a pnpm-capable Node: pnpm@11 needs Node >=22.13 (node:sqlite)
      # and cannot run on the Node 20 leg. Install here, then switch to the matrix
      # Node below to exercise the published artifact on that runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke import under Node
        run: node -e "import('./src/index.js').then(m => { if (typeof m.default !== 'function') process.exit(1) })"
      # Through the real exports map, which the check above bypasses by importing
      # the file directly. A typo in the map would otherwise ship.
      #
      # Only the plain-JavaScript subpaths: `./components` re-exports .astro files
      # that only Astro's Vite pipeline can load, and `./middleware` imports the
      # virtual config module that only exists inside a build. Both are covered by
      # the fixtures instead, which import them the way a project does.
      - name: Smoke import the published JavaScript subpaths
        run: node --input-type=module -e "await Promise.all(['astro-aeo', 'astro-aeo/page'].map((s) => import(s)))"
      # Unit tests only. The e2e suites shell out to `astro build`, and the Astro
      # devDependency installed here is 7, whose own engines.node is >=22.12.0, so
      # they cannot run on the 20.19.5 leg. That combination is also one no user
      # has: a real Node 20 user is on Astro 5 or 6, whose Node floors are lower.
      # This job's purpose is to prove the published artifact runs on each
      # supported Node, which the remaining steps do.
      - name: Core test suite under Node ${{ matrix.node }}
        run: node node_modules/vitest/vitest.mjs run --exclude '**/*.e2e.test.js' --exclude '**/node_modules/**'
      - name: Current TypeScript under Node ${{ matrix.node }}
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: TypeScript 5.5 consumer under Node ${{ matrix.node }}
        run: node node_modules/typescript-floor/bin/tsc --noEmit -p fixtures/types-consumer/tsconfig.json
      - name: CLI runs under Node
        run: node bin/astro-aeo.js validate fixtures/dist-valid
