name: W1-Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (astro ${{ matrix.astro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        astro: ['5', '6', '7']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pin Astro version for this leg
        if: matrix.astro != '7'
        run: pnpm add -D astro@${{ matrix.astro }}
      - name: Typecheck
        run: pnpm run typecheck
      # The published .d.ts files are hand-written and only ever seen by this
      # repo's own (newest) TypeScript. This checks them the way a downstream
      # project on an older toolchain would.
      - name: Consumer types on the oldest supported TypeScript
        run: pnpm run test:types
      - name: Unit, CLI and build e2e tests
        run: pnpm test
      - name: Dev-server e2e (astro 7 leg only)
        if: matrix.astro == '7'
        run: pnpm run test:dev
      # The on-demand contract needs a real adapter, so it cannot run against a
      # static build or the dev server. Newest Astro only, matching test:dev.
      - name: Adapter e2e (astro 7 leg only)
        if: matrix.astro == '7'
        run: pnpm run test:ssr

  node-compat:
    name: node ${{ matrix.node }} compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # Install with a pnpm-capable Node: pnpm@11 needs Node >=22.13 (node:sqlite)
      # and cannot run on the Node 20 leg. Install here, then switch to the matrix
      # Node below to exercise the published artifact on that runtime.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke import under Node
        run: node -e "import('./src/index.js').then(m => { if (typeof m.default !== 'function') process.exit(1) })"
      # Through the real exports map, which the check above bypasses by importing
      # the file directly. A typo in the map would otherwise ship.
      - name: Smoke import every published subpath
        run: node --input-type=module -e "await Promise.all(['astro-aeo', 'astro-aeo/components'].map((s) => import(s)))"
      - name: CLI runs under Node
        run: node bin/astro-aeo.js validate fixtures/dist-valid
